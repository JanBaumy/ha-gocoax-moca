[project]
name = "ha-gocoax-moca"
version = "0.1.0"
description = "Home Assistant Custom Integration fuer GoCoax/MaxLinear MoCA-Adapter"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-aiohttp>=1.0",
    "pytest-homeassistant-custom-component>=0.13.356",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
